# Installed by K-Git Studio. Run it from the Builds tab.
name: K-Git Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'What to build'
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab
          - both
      publish_release:
        description: 'Also publish the files as a GitHub pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write # needed only to publish a release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        run: ./gradlew assembleRelease
      - name: Build AAB
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        run: ./gradlew bundleRelease
      - name: Upload APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: '**/build/outputs/apk/release/*.apk'
          retention-days: 14
      - name: Upload AAB
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: '**/build/outputs/bundle/release/*.aab'
          retention-days: 14
      - name: Publish GitHub pre-release
        if: ${{ inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -path '*/build/*outputs*' \( -name '*.apk' -o -name '*.aab' \) -not -path './.git/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No APK or AAB files were found to publish."
            exit 1
          fi
          gh release create "build-${GITHUB_RUN_NUMBER}" "${files[@]}" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Built by K-Git Studio from ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" --prerelease
